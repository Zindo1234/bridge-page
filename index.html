<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verificação de Segurança | Recompensa TON</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #0098ea; /* Azul oficial da rede TON */
      --accent-hover: #0081c7;
      --success: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .bridge-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .badge-ton {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 152, 234, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 152, 234, 0.3);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .icon-container {
      font-size: 52px;
      margin-bottom: 12px;
      line-height: 1;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Simulação de Checkbox Anti-Bot para Forçar Interação */
    .captcha-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .captcha-box:hover {
      border-color: var(--accent);
      background: #111c35;
    }

    .captcha-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .custom-check {
      width: 24px;
      height: 24px;
      border: 2px solid #64748b;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: transparent;
    }

    .custom-check.active {
      border-color: var(--success);
      background: var(--success);
    }

    .custom-check svg {
      display: none;
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
    }

    .custom-check.active svg {
      display: block;
    }

    .captcha-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .captcha-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 9px;
      color: #64748b;
    }

    /* Botão Principal */
    .btn-submit {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 4px 15px rgba(0, 152, 234, 0.3);
      cursor: pointer;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .timer-info {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }

    .timer-info span {
      color: #f59e0b;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="bridge-card">
    <div class="badge-ton">💎 Recompensa Pronta</div>
    
    <div class="icon-container">🎁</div>
    
    <h1>Desbloquear Recompensa</h1>
    <p>Conclua a verificação rápida de acesso para desbloquear o seu link patrocinado e receber as tarefas ativas.</p>

    <!-- Caixa de Interação (Simulação Anti-Bot) -->
    <div class="captcha-box" onclick="processAccess()">
      <div class="captcha-left">
        <div class="custom-check" id="check-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="captcha-text">Não sou um robô</span>
      </div>
      <div class="captcha-brand">
        <span>SISTEMA SEGURO</span>
        <span>VERIFIED</span>
      </div>
    </div>

    <!-- Botão de Ação Direta -->
    <a href="https://uplcm.com/4/12198670" class="btn-submit" onclick="trackClick(event)">
      ACESSAR AGORA &raquo;
    </a>

    <div class="timer-info">
      Sua sessão expira em: <span id="countdown">02:45</span>
    </div>
  </div>

  <script>
    const MONETAG_LINK = "https://uplcm.com/4/12198670";

    // Ação ao marcar o captcha
    function processAccess() {
      const check = document.getElementById('check-icon');
      check.classList.add('active');

      setTimeout(() => {
        window.location.href = MONETAG_LINK;
      }, 400);
    }

    // Ação ao clicar no botão
    function trackClick(e) {
      e.preventDefault();
      document.getElementById('check-icon').classList.add('active');
      setTimeout(() => {
        window.location.href = MONETAG_LINK;
      }, 200);
    }

    // Contador decrescente para elevar a urgência
    let duration = 165;
    const countdownEl = document.getElementById('countdown');
    setInterval(() => {
      let minutes = Math.floor(duration / 60);
      let seconds = duration % 60;
      countdownEl.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      if (duration > 0) duration--;
    }, 1000);
  </script>
</body>
</html>
