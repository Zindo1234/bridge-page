<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A redirecionar...</title>
    <!-- Fallback caso o JavaScript do utilizador esteja desativado -->
    <meta http-equiv="refresh" content="3;url=https://uplcm.com/4/12198670">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            width: 360px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>A verificar segurança...</h2>
        <p>A redirecionar em <span id="timer">2</span> segundos...</p>
        <a href="https://uplcm.com/4/12198670" class="btn" id="manualBtn">Continuar Imediatamente</a>
    </div>

    <script>
        const targetUrl = "https://uplcm.com/4/12198670";
        let seconds = 2;
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(function() {
            seconds--;
            if (timerElement) {
                timerElement.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.replace(targetUrl);
            }
        }, 1000);
    </script>
</body>
</html>
